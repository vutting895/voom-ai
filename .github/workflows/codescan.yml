# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow requires that you have an existing account with codescan.io
# For more information about configuring your workflow,
# read our documentation at https://github.com/codescan-io/codescan-scanner-action
name: CodeScan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '45 18 * * 2'

permissions:
  contents: read

jobs:
    CodeScan:
        permissions:
          contents: read # for actions/checkout to fetch code
          security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
          actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Set up Java 17
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: "17"
            -   name: Cache files
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.sonar
                    key: ${{ runner.os }}-sonar-5.0.2.4997
                    restore-keys: ${{ runner.os }}-sonar-
            -   name: Validate CodeScan secret presence
                shell: bash
                env:
                    CODESCAN_AUTH_TOKEN: ${{ secrets.CODESCAN_AUTH_TOKEN }}
                    CODESCAN_ORGANIZATION_KEY: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
                    CODESCAN_PROJECT_KEY: ${{ secrets.CODESCAN_PROJECT_KEY }}
                run: |
                    missing=0
                    for name in CODESCAN_AUTH_TOKEN CODESCAN_ORGANIZATION_KEY CODESCAN_PROJECT_KEY; do
                      if [[ -z "${!name}" ]]; then
                        echo "::error::Required GitHub Actions secret is missing or unavailable in this workflow context: ${name}"
                        missing=1
                      else
                        echo "Secret presence check passed: ${name}"
                      fi
                    done
                    if [[ "$missing" -ne 0 ]]; then
                      exit 1
                    fi
            -   name: Run Analysis
                uses: codescan-io/codescan-scanner-action@5b2e8c5683ef6a5adc8fa3b7950bb07debccce12
                env:
                    # The CodeScan action's bundled sonarqube-scanner package supports
                    # SONAR_SCANNER_VERSION. 4.4.0.2170 runs Java 11 and cannot load
                    # the current CodeScan server's Java 17 bytecode. CLI 5.0.2 bundles Java 17 and retains the legacy Linux archive naming expected by this wrapper.
                    SONAR_SCANNER_VERSION: "5.0.2.4997"
                with:
                    login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
                    organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
                    projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}
            -   name: Upload SARIF file
                uses: github/codeql-action/upload-sarif@v3
                with:
                    sarif_file: codescan.sarif
