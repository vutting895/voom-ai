name: Client Build Verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - "netlify/**"
      - "netlify.toml"
      - "package.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Typecheck and build web client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run web auth lifecycle tests
        run: npm --workspace @voom-ai/web test

      - name: Typecheck web client
        run: npm run typecheck:web

      - name: Build web client
        run: npm run build:web

  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Runner preflight diagnostics
        shell: bash
        run: |
          set -eu
          echo "Runner OS: ${RUNNER_OS}"
          echo "Runner architecture: ${RUNNER_ARCH}"
          echo "GitHub Actions run ID: ${GITHUB_RUN_ID}"
          echo "GitHub Actions attempt: ${GITHUB_RUN_ATTEMPT}"
          uname -a
          df -h
          git --version

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.9"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run Android unit tests
        run: gradle --no-daemon -p apps/android testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon -p apps/android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voom-ai-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
