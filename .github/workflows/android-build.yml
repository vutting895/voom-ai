name: Client Build Verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, feature/voom-ai-client-foundation]
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - "netlify/**"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Typecheck and build web client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Run web auth lifecycle tests
        run: npm --workspace @voom-ai/web test

      - name: Typecheck web client
        run: npm run typecheck:web

      - name: Build web client
        run: npm run build:web

  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Runner preflight diagnostics
        shell: bash
        run: |
          set -eu
          echo "Runner OS: ${RUNNER_OS}"
          echo "Runner architecture: ${RUNNER_ARCH}"
          echo "GitHub Actions run ID: ${GITHUB_RUN_ID}"
          echo "GitHub Actions attempt: ${GITHUB_RUN_ATTEMPT}"
          uname -a
          df -h
          git --version

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run Android unit tests
        run: gradle --no-daemon -p apps/android testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon -p apps/android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: voom-ai-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
